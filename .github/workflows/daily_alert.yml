name: Daily PM Job Alert (09:00 AM KST)

on:
  schedule:
    # 00:00 UTC = 한국 시각(KST) 오전 09:00 매일 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 깃허브 웹 화면에서 수동 실행 버튼 제공

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 채용정보 수집 및 이메일 브리핑 발송
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python main.py
